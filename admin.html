<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · DEV MAHADI</title>
<style>
:root{color-scheme:dark;--teal:#19e6d4;--purple:#b66dff;--red:#ff4d6d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#03060a;color:#d7e6ea;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:18px;letter-spacing:.12em;color:var(--teal);margin:6px 0 4px}
h2{font-size:13px;letter-spacing:.14em;color:var(--teal);margin:26px 0 10px}
.sub{color:#6b7f86;font-size:12.5px;line-height:1.5;margin:0 0 6px}
.box{border:1px solid rgba(25,230,212,.25);border-radius:12px;padding:12px;margin-bottom:12px;background:rgba(25,230,212,.04)}
.box.v{border-color:rgba(182,109,255,.35);background:rgba(182,109,255,.05);margin-top:10px}
label{display:block;font-size:11.5px;color:#8fa3aa;margin:8px 0 0}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#07121a;color:#e8f3f5;font:inherit}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:600 12.5px system-ui;padding:10px 14px;border-radius:8px;border:1px solid var(--teal);background:rgba(25,230,212,.1);color:var(--teal);cursor:pointer}
button.d{border-color:var(--red);color:var(--red);background:rgba(255,77,109,.08)}
button.g{border-color:rgba(255,255,255,.2);color:#aebdc2;background:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.logo{display:flex;align-items:center;gap:12px}.logo img{width:64px;height:64px;object-fit:contain;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#07121a}
.fix{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(3,6,10,.95);border-top:1px solid rgba(255,255,255,.08)}
.fix .in{max-width:560px;margin:0 auto;display:flex;gap:8px}.fix button{flex:1;padding:13px}
#msg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0b2a2a;border:1px solid var(--teal);color:var(--teal);padding:8px 14px;border-radius:8px;display:none;font-size:12.5px;z-index:9}
ol{padding-left:18px;color:#aebdc2;line-height:1.6;font-size:13px}
</style></head>
<body><div class="w">
<h1>ADMIN PANEL</h1>
<p class="sub">Ekhane shob kichu change koro, tarpor niche <b>Save (live)</b> chap. Password dile site sathe sathe update hobe.</p>
<div id="app"></div>
<p class="sub">Backup button config.json download kore, Copy button JSON copy kore. Password Render-e <b>ADMIN_PASSWORD</b> variable-e set kora thake.</p>
</div>
<div class="fix"><div class="in"><button id="sv">💾 Save (live)</button><button class="g" id="dl">⬇ Backup</button><button class="g" id="cp">Copy</button></div></div>
<div id="msg"></div>
<script>
var DEFAULT = {
  "brand": "DEV MAHADI WEB STUDIO",

  "welcome": "Welcome to DEV MAHADI WEB STUDIO. Explore our latest web tools and downloads below.",
  "items": [
    {
      "name": "FILES",
      "cat": "apps",
      "color": "teal",
      "icon": "📁",
      "title": "VERSION",
      "versions": [
        {
          "name": "Version 2.1",
          "desc": "Image to URL Website",
          "btn": "VIEW",
          "url": "#"
        },
        {
          "name": "Version 3.4",
          "desc": "Custom Image URL Website Builder",
          "btn": "VIEW",

        }
      ]
    },
    {
      "name": "TEMP MAIL",
      "cat": "web",
      "color": "purple",
      "icon": "📄",
      "title": "TEMP MAIL · VERSION",
      "versions": [
        {
          "name": "VERSION 4.5",
          "desc": "Open Temp Mail Website",
          "btn": "OPEN",
          "url": "#"
        },
        {
          "name": "VERSION 2.1",
          "desc": "Netlify + Customize Website",
          "btn": "VIEW",
          "url": "#",
          "color": "purple"
        }
      ]
    }
  ],
  "follow": [
    {
      "name": "JOIN NOW TELEGRAM",
      "color": "purple",
      "url": "#",
      "icon": "<svg viewBox=\"0 0 24 24\"><path d=\"M22 3 2 11l6 2 2 7 3-4 5 4z\"/><path d=\"m8 13 14-10\"/></svg>"
    },
    {
      "name": "SUBSCRIBE NOW YOUTUBE",
      "color": "red",
      "url": "#",
      "icon": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"4\"/><path d=\"m10 9 5 3-5 3z\"/></svg>"
    },
    {
      "name": "FOLLOW NOW TIKTOK",
      "color": "teal",
      "url": "#",
      "icon": "<svg viewBox=\"0 0 24 24\"><path d=\"M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5\"/><path d=\"M14 3c.5 2.5 2.2 4 5 4.2\"/></svg>"
    }
  ]
};
var C = DEFAULT, $ = function(s){return document.querySelector(s)};
function getj(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
getj("/api/config").then(function(c){return c&&c.items?c:getj("config.json")}).then(function(c){ if(c&&c.items) C=c; render(); });
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function inp(p,l,v){return '<label>'+l+'<input data-p="'+p+'" value="'+esc(v)+'"></label>'}
function sel(p,l,v,o){return '<label>'+l+'<select data-p="'+p+'">'+o.map(function(x){return '<option'+(x===v?' selected':'')+'>'+x+'</option>'}).join("")+'</select></label>'}
var COL=["teal","purple","red"];
function render(){
  var h='<h2>// SITE INFO //</h2><div class="box">'+inp("brand","Brand / footer name",C.brand)+inp("handle","Handle (TikTok etc.)",C.handle)+
    '<label>Welcome text<textarea data-p="welcome">'+esc(C.welcome)+'</textarea></label>'+
    '<label>Logo</label><div class="logo">'+(C.logo?'<img src="'+C.logo+'" alt="">':'<span class="sub">Built-in logo use hocche</span>')+
    '<div><input type="file" id="lf" accept="image/*">'+(C.logo?'<div class="bar"><button class="g" data-a="rmlogo">Remove custom logo</button></div>':'')+'</div></div></div>';
  h+='<h2>// FILES & TOOLS //</h2>';
  (C.items||[]).forEach(function(it,i){
    h+='<div class="box"><div class="row">'+inp("items."+i+".name","Card name",it.name)+inp("items."+i+".icon","Icon (emoji)",it.icon)+'</div><div class="row">'+
      sel("items."+i+".cat","Filter",it.cat,["apps","web"])+sel("items."+i+".color","Color",it.color,COL)+'</div>'+inp("items."+i+".title","Popup title",it.title);
    (it.versions||[]).forEach(function(v,j){
      var q="items."+i+".versions."+j+".";
      h+='<div class="box v">'+inp(q+"name","Version name",v.name)+inp(q+"desc","Description",v.desc)+inp(q+"url","Link (https://...)",v.url)+
        '<div class="row">'+inp(q+"btn","Button text",v.btn)+sel(q+"color","Color",v.color||"teal",COL)+'</div>'+
        '<div class="bar"><button class="d" data-a="delv" data-i="'+i+'" data-j="'+j+'">Delete version</button></div></div>';
    });
    h+='<div class="bar"><button data-a="addv" data-i="'+i+'">+ Add version</button><button class="d" data-a="deli" data-i="'+i+'">Delete card</button></div></div>';
  });
  h+='<button data-a="addi">+ Add new card</button><h2>// FOLLOW LINKS //</h2>';
  (C.follow||[]).forEach(function(f,i){
    h+='<div class="box">'+inp("follow."+i+".name","Button text",f.name)+inp("follow."+i+".url","Link (https://...)",f.url)+sel("follow."+i+".color","Color",f.color,COL)+
      '<div class="bar"><button class="d" data-a="delf" data-i="'+i+'">Delete</button></div></div>';
  });
  h+='<button data-a="addf">+ Add follow link</button>';
  $("#app").innerHTML=h;
  $("#lf").onchange=function(){ upload(this.files[0]); };
}
function setp(o,p,v){var a=p.split("."),k;for(var n=0;n<a.length-1;n++)o=o[a[n]];o[a[a.length-1]]=v}
document.addEventListener("input",function(e){var p=e.target.dataset&&e.target.dataset.p;if(p)setp(C,p,e.target.value)});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
  if(a==="addi")C.items.push({name:"NEW CARD",cat:"apps",color:"teal",icon:"📁",title:"VERSION",versions:[{name:"Version 1.0",desc:"Description",btn:"VIEW",url:"#"}]});
  if(a==="deli"&&confirm("Delete this card?"))C.items.splice(i,1);
  if(a==="addv")C.items[i].versions.push({name:"Version",desc:"Description",btn:"VIEW",url:"#",color:"purple"});
  if(a==="delv")C.items[i].versions.splice(j,1);
  if(a==="addf")C.follow.push({name:"NEW LINK",color:"teal",url:"#",icon:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'});
  if(a==="delf"&&confirm("Delete this link?"))C.follow.splice(i,1);
  if(a==="rmlogo")delete C.logo;
  render();
});
function upload(f){
  if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    C.logo=c.toDataURL("image/webp",.88);render();toast("Logo set hoyeche");};im.src=r.result;};
  r.readAsDataURL(f);
}
function toast(t){var m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(function(){m.style.display="none"},2200)}
$("#sv").onclick=function(){var p=sessionStorage.getItem("pw")||prompt("Admin password:");if(!p)return;
  fetch("/api/config",{method:"POST",headers:{"content-type":"application/json","x-admin-password":p},body:JSON.stringify(C)}).then(function(r){
    if(r.status===401){sessionStorage.removeItem("pw");toast("Password vul");return}
    if(!r.ok){toast("Save hoyni ("+r.status+")");return}
    sessionStorage.setItem("pw",p);toast("Saved! Site live update hoyeche")}).catch(function(){toast("Network error")});
};
$("#dl").onclick=function(){
  var u=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:"application/json"})),a=document.createElement("a");
  a.href=u;a.download="config.json";document.body.appendChild(a);a.click();a.remove();toast("config.json download hoyeche");
};
$("#cp").onclick=function(){navigator.clipboard.writeText(JSON.stringify(C,null,2)).then(function(){toast("Copied")},function(){toast("Copy hoyni")})};
</script></body></html>
