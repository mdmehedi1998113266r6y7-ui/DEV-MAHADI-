<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DEV MAHADI · Web Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#03060a; --panel:#08141a; --text:#d7e6ea; --muted:#6b7f86;
  --teal:#19e6d4; --purple:#b66dff; --red:#ff4d6d; --green:#2cff7a;
  --font-d:"Orbitron","Segoe UI",system-ui,sans-serif;
  --font-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(25,230,212,.10),transparent 55%),radial-gradient(ellipse at 100% 60%,rgba(182,109,255,.08),transparent 50%)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 24px}
.top{display:flex;justify-content:flex-end;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.06);margin:0 -16px 0;padding-inline:20px}
.online{font:600 12px var(--font-d);letter-spacing:.12em;color:var(--green);display:flex;align-items:center;gap:7px}
.online i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.logo-wrap{display:flex;justify-content:center;margin-top:24px}
.logo{width:190px;height:190px;border-radius:50%;padding:4px;
  background:conic-gradient(from 0deg,var(--teal),var(--purple),#ff3d9a,var(--teal));
  box-shadow:0 0 28px rgba(25,230,212,.45),0 0 50px rgba(182,109,255,.3);animation:spin 8s linear infinite}
.logo>div{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#0b2a52,#040b1a);
  display:grid;place-items:center;animation:spin 8s linear infinite reverse}
.logo b{font:700 26px var(--font-d);letter-spacing:.06em;color:#fff;text-shadow:0 0 12px var(--teal)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-img{width:100%;height:100%;object-fit:contain;padding:12%;display:block;border-radius:50%;filter:drop-shadow(0 0 8px rgba(30,150,255,.5))}
@keyframes float{50%{transform:translateY(-6px)}}
.handle{text-align:center;margin:16px 0 0;font:600 13px var(--font-b);color:var(--teal)}
.welcome{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:14px 8px 0}
.divider{display:flex;align-items:center;gap:12px;margin:30px 0 20px;font:500 12px var(--font-d);letter-spacing:.16em;color:var(--teal);white-space:nowrap}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.7}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;border:1px solid rgba(25,230,212,.25);border-radius:10px;background:rgba(25,230,212,.04)}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 14px rgba(25,230,212,.25)}
.search svg{flex:none;opacity:.6}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:400 14px var(--font-b)}
.search input::placeholder{color:#4d6168}
.chips{display:flex;gap:8px;margin:12px 0 16px}
.chip{font:500 11px var(--font-d);letter-spacing:.1em;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:none;color:var(--muted);cursor:pointer}
.chip.on{color:var(--teal);border-color:var(--teal);box-shadow:0 0 10px rgba(25,230,212,.2)}
.card{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 12px;padding:14px;text-align:left;cursor:pointer;
  font:700 14px var(--font-d);letter-spacing:.1em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:12px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 22%,#050b10),color-mix(in srgb,var(--c) 6%,#050b10));
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 14%,transparent);transition:transform .15s,box-shadow .2s;text-decoration:none}
.card:active{transform:scale(.98)}
.card:hover{box-shadow:0 0 26px color-mix(in srgb,var(--c) 35%,transparent)}
.card .ico{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.card .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .lbl{flex:1}
.card .arr{opacity:.7;font-size:16px}
.card.sm{padding:13px 14px;font-size:13px;gap:12px}
.card.sm .ico{width:22px;height:22px;background:none;border:0}
.teal{--c:var(--teal)} .purple{--c:var(--purple)} .red{--c:var(--red)}
.empty{display:none;text-align:center;color:var(--muted);font-size:13px;padding:10px 0 6px}
footer{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.05);text-align:center;font:500 11px var(--font-d);letter-spacing:.14em;color:#3a4a50}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{width:100%;max-width:420px;padding:22px 18px 18px;border-radius:18px;border:1px solid rgba(25,230,212,.3);
  background:linear-gradient(160deg,#0b2128,#071016);box-shadow:0 0 40px rgba(25,230,212,.18);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal h2{margin:0 0 18px;text-align:center;font:500 24px var(--font-d);letter-spacing:.1em}
.ver{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,#060c11)}
.ver .t{flex:1;min-width:0}
.ver strong{display:block;font:700 14px var(--font-d);letter-spacing:.06em;color:var(--c)}
.ver span{display:block;margin-top:5px;font-size:12px;color:#aebdc2}
.ver a{flex:none;padding:8px 14px;border-radius:8px;border:1px solid var(--c);color:var(--c);text-decoration:none;font:500 11px var(--font-d);letter-spacing:.1em}
.close{display:block;margin:14px auto 0;padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--muted);font:500 11px var(--font-d);letter-spacing:.1em;cursor:pointer}
</style>
</head>

  list.querySelectorAll(".card").forEach(function(c){
    var it = CONFIG.items[c.dataset.i];
    var ok = (filter === "all" || it.cat === filter) && (!q || it.name.toLowerCase().indexOf(q) > -1 ||
      it.versions.some(function(v){ return (v.name + " " + v.desc).toLowerCase().indexOf(q) > -1; }));
    c.style.display = ok ? "" : "none";
    if (ok) shown++;
  });
  $("#empty").style.display = shown ? "none" : "block";
}
$("#q").addEventListener("input", apply);
$("#chips").addEventListener("click", function(e){
  var c = e.target.closest(".chip"); if (!c) return;
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("on", x === c); });
  apply();
});

function openModal(it){
  $("#mt").textContent = it.title;
  var mb = $("#mb"); mb.innerHTML = "";
  it.versions.forEach(function(v, i){
    var d = document.createElement("div");
    d.className = "ver " + (v.color || it.color);
    if (i === 0 && !v.color) d.className = "ver teal";
    d.innerHTML = '<div class="t"><strong></strong><span></span></div><a target="_blank" rel="noopener"></a>';
    d.querySelector("strong").textContent = v.name;
    d.querySelector("span").textContent = v.desc;
    var a = d.querySelector("a"); a.textContent = v.btn; a.href = v.url;
    mb.appendChild(d);
  });
  $("#ov").classList.add("open");
}
function closeModal(){ $("#ov").classList.remove("open"); }
$("#mc").onclick = closeModal;
$("#ov").addEventListener("click", function(e){ if (e.target === this) closeModal(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });
}
function getj(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
getj("/api/config").then(function(c){return c&&c.items?c:getj("config.json")}).then(function(c){ if(c&&c.items) CONFIG=c; boot(); });
</script>
</body>
</html>
